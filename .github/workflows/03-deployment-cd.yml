name: 03 - Deployment CD

on:
  workflow_run:
    workflows:
      - "02 - SonarQube Analysis"
    types:
      - completed

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download JAR from Pipeline 2
        uses: actions/download-artifact@v4
        with:
          name: java-app-jar
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: downloaded-artifact

      - name: Configure Maven for GitHub Packages
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'EOF'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          EOF

      - name: Publish Maven package
        run: mvn deploy -DskipTests

      - name: Prepare JAR for deployment
        run: |
          mkdir -p deployment
          cp downloaded-artifact/*.jar deployment/app.jar

      - name: Deploy JAR to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          scp -i ~/.ssh/deploy_key deployment/app.jar \
            "$EC2_USERNAME@$EC2_HOST:/tmp/app.jar"

          ssh -i ~/.ssh/deploy_key "$EC2_USERNAME@$EC2_HOST" << 'EOF'
            sudo mkdir -p /opt/java-app
            sudo mv /tmp/app.jar /opt/java-app/app.jar
            sudo chown ubuntu:ubuntu /opt/java-app/app.jar
          EOF
